<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Habbits App</title>
    <link rel="icon" href="images/angle-brackets--code-angle-programming-file-bracket.svg" type="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app">

        <div class="content">
            <header class="header">
                <h1 class="header-title" id="input-name">Add your first habit</h1>
                <div class="header__progres">
                    <div class="progres-text">
                        <div class="progres-name">Progress</div>
                        <div class="progres-percent">%</div>
                    </div>
                    <div class="progres-bar">
                        <div class="progres-bar-active"></div>
                    </div>
                </div>
            </header>
            <main class="main">
                <div class="main__list" id="main__list">
                    <!-- <div class="list-habbit">
                        <div class="habbit-day">Day_</div>
                        <div class="habbit-comment">Comment</div>
                        <button class="habbit-delete">
                            <img src="images/file-delete-alternate--file-common-delete-cross.svg" alt="delete">
                        </button>
                    </div> -->
                </div>

                <div class="list-habbit">
                    <div class="habbit-day">Day</div>
                    <form class="habbit-form" onsubmit="addDays(event)">
                        <input name="comment" class="input-icon" type="text" placeholder="Comment">
                        <img class="input-item" src="images/chat-bubble-typing-oval--messages-message-bubble-typing-chat.svg" alt="Comment">
                        <button class="habbit-ok" type="submit">
                            <img src="images/check--check-form-validation-checkmark-success-add-addition-tick.svg" alt="Ok">
                        </button>
                    </form>
                </div>
            </main>
        </div>

        <div class="mobile-menu">
            <div class="panel">
                <nav class="panel__menu">
    
                    <div class="menu-list">
                        <!-- <button class="menu-item menu-item-active" menu-habbit-id="1">
                            <img src="images/code-monitor-1--code-tags-angle-bracket-monitor.svg" alt="Coding">
                        </button>
                        <button class="menu-item">
                            <img src="images/heart-rate-pulse-graph.svg" alt="Training">
                        </button>
                        <button class="menu-item">
                            <img src="images/fork-knife--fork-spoon-knife-food-dine-cook-utensils-eat-restaurant-dining-kitchenware.svg" alt="Nutrition">
                        </button> -->
                    </div>
                    <button class="menu-add" onclick="togglePopup()">
                        <img src="images/add-1--expand-cross-buttons-button-more-remove-plus-add-+-mathematics-math.svg" alt="Add">
                    </button>
                </nav>
            </div>
        </div>

        <div class="cover cover-hidden" id="delete-habbit-popup">
            <div class="popup popup-delete">
                <div class="delete-popup-content">
                    <img class="delete-habbit-icon" src="" alt="iconHabbit">
                    <h3>Should I remove this habit?</h3>
                    <div class="delete-buttons">
                        <button class="btn-cancel" onclick="closeDeleteModal()">No</button>
                        <button class="btn-delete" onclick="confirmDelete()">Yes</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="cover cover-hidden" id="add-habbit-popup">
            <div class="popup">
                <h2 class="popup__title">New habit</h2>
                <div class="icon-label">Icon</div>
                <div class="icon-select">
                    <button class="icon icon-active" onclick="setIcon(this, 'Coding')">
                        <img src="images/coding.svg" alt="Coding">
                    </button>
                    <button class="icon" onclick="setIcon(this, 'Sport')">
                        <img src="images/sport.svg" alt="Sport">
                    </button>
                    <button class="icon" onclick="setIcon(this,'Food')">
                        <img src="images/food.svg" alt="Food">
                    </button>

                    <button class="icon" onclick="setIcon(this, 'Book')">
                        <img src="images/book.svg" alt="Book">
                    </button>
                    <button class="icon" onclick="setIcon(this, 'Design')">
                        <img src="images/design.svg" alt="Design">
                    </button>
                    <button class="icon" onclick="setIcon(this,'Film')">
                        <img src="images/film.svg" alt="Film">
                    </button>

                    <button class="icon" onclick="setIcon(this, 'Gaming')">
                        <img src="images/gaming.svg" alt="Gaming">
                    </button>
                    <button class="icon" onclick="setIcon(this, 'Learning')">
                        <img src="images/learning.svg" alt="Learning">
                    </button>
                    <button class="icon" onclick="setIcon(this,'Paint')">
                        <img src="images/paint.svg" alt="Paint">
                    </button>

                    <button class="icon" onclick="setIcon(this, 'Sleep')">
                        <img src="images/sleep.svg" alt="Sleep">
                    </button>
                    <button class="icon" onclick="setIcon(this,'Smoking')">
                        <img src="images/smoking.svg" alt="Smoking">
                    </button>
                </div>

                <form class="popup__form" onsubmit="addHabbit(event)">
                    <input type="text" class="input-icon" name="name" placeholder="Habit name">
                    <input type="text" class="input-icon" name="icon" hidden>
                    <input type="number" class="input-icon" name="target" placeholder="Goals (day)" min="1" max="365">
                    <button class="habbit-ok" type="submit">
                        <img src="images/check--check-form-validation-checkmark-success-add-addition-tick.svg" alt="Ok">
                    </button>
                </form>
                <button class="popup__close" onclick="togglePopup()">
                    <img src="images/delete.svg" alt="Close">
                </button>

            </div>
        </div>
    </div>

    <script src="scripts/app.js"></script>
    <!-- <script>fetch('scripts/data.json')</script> -->
</body>
</html>
