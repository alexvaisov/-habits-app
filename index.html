<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habbits App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app">
        <div class="panel">
            <h3>Habbit</h3>
            <img class="logo" src="images/angle-brackets--code-angle-programming-file-bracket.svg" alt="Logo Habbit App">
            <nav class="panel__menu">

                <div class="menu-list">
                    <button class="menu-item menu-item-active">
                        <img src="images/code-monitor-1--code-tags-angle-bracket-monitor.svg" alt="Coding">
                    </button>
                    <button class="menu-item">
                        <img src="images/heart-rate-pulse-graph.svg" alt="Training">
                    </button>
                    <button class="menu-item">
                        <img src="images/fork-knife--fork-spoon-knife-food-dine-cook-utensils-eat-restaurant-dining-kitchenware.svg" alt="Nutrition">
                    </button>
                </div>

                <button class="menu-add">
                    <img src="images/ai-edit-spark--change-edit-modify-pencil-write-writing-artificial-intelligence-ai.svg" alt="Add">
                </button>

            </nav>
        </div>

        <div class="content">

        </div>
    </div>
</body>
</html>
