<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habbits App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app">
        <div class="panel">
            <h3>Habbit</h3>
            <img class="logo" src="images/angle-brackets--code-angle-programming-file-bracket.svg" alt="Logo Habbit App">
            <nav class="panel__menu">

                <div class="menu-list">
                    <!-- <button class="menu-item menu-item-active" menu-habbit-id="1">
                        <img src="images/code-monitor-1--code-tags-angle-bracket-monitor.svg" alt="Coding">
                    </button>
                    <button class="menu-item">
                        <img src="images/heart-rate-pulse-graph.svg" alt="Training">
                    </button>
                    <button class="menu-item">
                        <img src="images/fork-knife--fork-spoon-knife-food-dine-cook-utensils-eat-restaurant-dining-kitchenware.svg" alt="Nutrition">
                    </button> -->
                </div>

                <button class="menu-add">
                    <img src="images/add-1--expand-cross-buttons-button-more-remove-plus-add-+-mathematics-math.svg" alt="Add">
                </button>

            </nav>
        </div>

        <div class="content">
            <header class="header">
                <h1 class="header-title">Coding</h1>
                <div class="header__progres">
                    <div class="progres-text">
                        <div class="progres-name">Progres</div>
                        <div class="progres-persent">80%</div>
                    </div>
                    <div class="progres-bar">
                        <div class="progres-bar-active"></div>
                    </div>
                </div>
            </header>
            <main class="main">
                <div class="main__list">
                    <div class="list-habbit">
                        <div class="habbit-day">Day 1</div>
                        <div class="habbit-comment">Comment</div>
                        <button class="habbit-delete">
                            <img src="images/file-delete-alternate--file-common-delete-cross.svg" alt="delete">
                        </button>
                    </div>
                </div>

                <div class="list-habbit">
                    <div class="habbit-day">Day 2</div>
                    <form class="habbit-form">
                        <input class="input-icon" type="text" placeholder="Comment">
                        <img class="input-item" src="images/chat-bubble-typing-oval--messages-message-bubble-typing-chat.svg" alt="Comment">
                    </form>
                    <button class="habbit-ok">
                        <img src="images/check--check-form-validation-checkmark-success-add-addition-tick.svg" alt="Ok">
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="scripts/app.js"></script>
    <script src="scripts/data.json">fetch('data.json')</script>
</body>
</html>
